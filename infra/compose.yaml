name: ${COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: ${TZ:-Asia/Jakarta}
      PGTZ: ${TZ:-Asia/Jakarta}
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=256MB
      - -c
      - timezone=Asia/Jakarta
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:8.8.1-alpine3.23
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Jakarta}
    command:
      - sh
      - -eu
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    ports:
      - 127.0.0.1:${REDIS_PORT:-56379}:6379
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.30.5
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
      MP_SMTP_AUTH_ACCEPT_ANY: "0"
      MP_SMTP_AUTH_ALLOW_INSECURE: "0"
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025
    volumes:
      - mailpit_data:/data
    restart: unless-stopped
    networks:
      - backend

  storage-init:
    image: alpine:3.23.5
    command:
      - sh
      - -eu
      - -c
      - >-
        umask 007;
        mkdir -p /data/uploads /data/generated;
        touch /data/.initialized;
        test -w /data/uploads;
        test -w /data/generated
    volumes:
      - private_files:/data
    network_mode: none

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
  private_files:
    labels:
      com.kooka.storage.classification: private-sensitive
